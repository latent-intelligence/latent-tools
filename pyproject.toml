# latent-tools — a uv workspace of installable tools, one member per tool.
#
# The root is virtual: nothing installs it. A colleague installs one member:
#   uv tool install "git+https://github.com/latent-intelligence/latent-tools@<member>-v<version>#subdirectory=<member>"
# Members are listed one per line, so adding a tool is a new directory and one line here.

[tool.uv.workspace]
members = ["wiki-mcp", "records-mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "anyio>=4.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"*/src/*/cli.py" = ["B008"]  # typer.Option in defaults is idiomatic

[tool.mypy]
python_version = "3.11"
strict = true
files = ["wiki-mcp/src", "records-mcp/src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["lancedb.*", "pyarrow.*", "open_clip.*", "sentence_transformers.*", "torch.*", "PIL.*", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "wiki-mcp/tests", "records-mcp/tests"]
addopts = "-ra --import-mode=importlib -m 'not conform'"
markers = ["conform: needs both the tool and the store's own serve installed (just conform)"]
