[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latent-wiki-mcp"
version = "0.1.2"
description = "A standalone MCP server over a published latent-wiki store — read-only, local or s3://."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Latent Intelligence" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.16",
    "rich>=13.0",
    "universal-pathlib>=0.2",
    "fsspec>=2024.0",
    # One `mcp` pin across every member and the store packages (house rule); uvicorn is the
    # HTTP transport, already in every mcp 2.x install and named because `serve.py` imports it.
    "mcp>=2.0,<3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
s3 = ["s3fs>=2024.0"]

[project.scripts]
latent-wiki-mcp = "latent_wiki_mcp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/latent_wiki_mcp"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]
